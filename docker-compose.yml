# Hedwig with its own MongoDB. `cp .env.example .env`, fill it in, then `docker compose up -d`.
# The app listens on port 3000; put your reverse proxy (Caddy, Traefik, nginx) in front of it for HTTPS.
services:
  app:
    build: .
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - BODY_SIZE_LIMIT=25M
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
volumes:
  mongo-data:
